# docker-compose.dev.yml — bs-practitioner-service (desarrollo local con Docker)
# Uso: docker compose -f docker-compose.dev.yml up -d
#
# Lee las variables directamente del .env local.
# Para desarrollo sin Docker usa: npm run start:dev

services:
  ms-bs-practitioner-service:
    build: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "${SSL_PORT:-20405}:${SSL_PORT:-20405}"
    env_file: .env
    environment:
      NODE_ENV: development
    volumes:
      # Certificado autofirmado de prueba (generado con openssl, nunca commiteado — ver .gitignore)
      - ./certs-dev:/app/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
