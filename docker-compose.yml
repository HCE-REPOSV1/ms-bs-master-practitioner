# docker-compose.yml — bs-practitioner-service (producción)
# Uso: docker compose down && docker compose build && docker compose up -d
#
# En el servidor solo necesitas un .env con una línea:
#   VAULT_TOKEN=hvs.xxxx
# El entrypoint.sh carga el resto desde Vault al arrancar.

services:
  ms-bs-practitioner-service:
    build: .
    ports:
      - "10405:10405"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: "10405"
      VAULT_ADDR: "http://host.docker.internal:8200"
      VAULT_SECRET_PATH: "hce/nestjs/practitioner-service"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:10405/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
